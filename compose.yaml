# asknget — production-shaped stack: Postgres + Django API.
#
#   docker compose up -d --build        # dev: also loads compose.override.yaml (live reload)
#   docker compose -f compose.yaml up -d --build   # prod-like: gunicorn, no bind mounts
#
# Application configuration comes from backend/.env (copy backend/.env.example);
# compose's own variables (HTTP_PORT) come from the root .env (copy .env.example).
# Every variable is documented in docs/environment.md.
# Data lives in named volumes, so `docker compose down` keeps it and
# `docker compose down -v` wipes it.

name: asknget

services:
  db:
    # Postgres 17 + pgvector (semantic search / recommendations). Same major as
    # plain postgres:17, so dump/restore and psql work unchanged.
    image: pgvector/pgvector:pg17-trixie
    env_file: backend/.env            # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-asknget} -d $${POSTGRES_DB:-asknget}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    # Uncomment to reach Postgres from tools on your PC (DBeaver, psql):
    # ports:
    #   - "127.0.0.1:5432:5432"

  web:
    build:
      context: ./backend
    image: asknget-api:latest
    env_file: backend/.env            # DATABASE_URL must point at db:5432 (see .env.example)
    environment:
      MEDIA_ROOT: /app/asknget/media
      SERVE_MEDIA: "0"                # the proxy serves uploads; Django never touches media requests
      BEHIND_PROXY: "1"               # trust X-Forwarded-Proto/Host from the proxy
      REDIS_URL: redis://redis:6379/0 # shared cache + publishing to the live bell
      # gunicorn sizing: WEB_CONCURRENCY / GUNICORN_CMD_ARGS default in the Dockerfile; override in backend/.env
    volumes:
      - media:/app/asknget/media      # user uploads survive image rebuilds
    expose:
      - "8000"                        # reachable by the proxy only; compose.override.yaml publishes it for dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    # Shared cache and the WebSocket channel layer (live bell). Ephemeral by design: nothing here is the record.
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  realtime:
    # WebSockets (/ws/notifications) under uvicorn, apart from gunicorn so long-lived sockets never hold an HTTP worker.
    image: asknget-api:latest
    env_file: backend/.env
    environment:
      SKIP_MIGRATE: "1"
      REDIS_URL: redis://redis:6379/0
      BEHIND_PROXY: "1"
    command: ["uvicorn", "asknget.asgi:application", "--host", "0.0.0.0", "--port", "8001", "--ws-ping-interval", "20", "--proxy-headers"]
    expose:
      - "8001"
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    # nginx edge: serves /media/ from the shared volume, gzips and buffers API
    # responses, and is the single published port. TLS terminates here later.
    image: nginx:1.29-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
    ports:
      - "${HTTP_PORT:-80}:80"         # HTTP_PORT is read by compose itself (shell env or a root .env), not backend/.env
    depends_on:
      web:
        condition: service_healthy
      realtime:
        condition: service_started   # nginx resolves the upstream at start
    restart: unless-stopped

  worker:
    # Background jobs. Today: keeps product embeddings fresh (catalog edits mark
    # rows stale; this loop re-embeds them). Add more periodic work here rather
    # than in request handlers.
    image: asknget-api:latest
    env_file: backend/.env
    environment:
      SKIP_MIGRATE: "1"               # web already migrates; don't race it
    command: ["python", "manage.py", "embed_products", "--watch", "--interval", "30"]
    healthcheck:
      disable: true                   # image healthcheck probes HTTP; the worker serves none
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  notifier:
    # Sends notification e-mail that did not go out right after its change was saved, and
    # retries failures (notifications/bus.py). Several copies may run: each message is claimed first.
    image: asknget-api:latest
    env_file: backend/.env
    environment:
      SKIP_MIGRATE: "1"
      REDIS_URL: redis://redis:6379/0
    command: ["python", "manage.py", "deliver_notifications", "--watch", "--interval", "10"]
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media:
