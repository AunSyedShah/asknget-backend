# Installed as /etc/nginx/snippets/asknget-app.conf: the application rules, included by every server block that serves the site.
#   /                       the React build (static files; unknown paths get index.html)
#   /api/ /django-admin/ /static/   the backend (gunicorn, 127.0.0.1:8000 only)
#   /media/                 uploads straight from disk (seller documents are never served from here)

client_max_body_size 30m;          # review media is capped at 25 MB in Django
server_tokens off;

gzip on;
gzip_types application/json text/plain text/css application/javascript image/svg+xml;
gzip_min_length 1024;
gzip_vary on;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

root /opt/asknget/frontend/current;

# Private papers: only through the API's signed links (sellers.files).
location /media/seller_documents/ {
    return 404;
}
location /media/category_requests/ {
    return 404;
}

location /media/ {
    alias /var/lib/asknget/media/;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

location /api/ {
    proxy_pass http://asknget_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 65s;        # > gunicorn --timeout 60
    proxy_buffering on;
}

# The Django admin (not /admin/: that belongs to the React app's own staff screens) and its static files / the Swagger UI.
location /django-admin/ {
    proxy_pass http://asknget_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
}

location /static/ {
    proxy_pass http://asknget_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    expires 7d;
}

# Vite's hashed files: safe to cache for a year.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location = /index.html {
    add_header Cache-Control "no-cache";
}

# Everything else is a screen of the React app (real paths such as /login, /seller/dashboard).
location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
