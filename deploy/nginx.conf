# asknget edge: serves uploads directly, buffers/compresses, proxies the API to gunicorn.
# Mounted at /etc/nginx/conf.d/default.conf by compose.yaml (service `proxy`).

upstream api {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30m;          # review media is capped at 25 MB in Django
    server_tokens off;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Seller identity/company documents are private: the API serves them through signed links (sellers.files).
    location /media/seller_documents/ {
        return 404;
    }

    # Product/review/store uploads: straight from the shared volume, long cache. nosniff: the browser must take the
    # type from the (server-chosen) extension, never guess HTML out of an image.
    location /media/ {
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }

    # Everything else (API, Swagger, admin, whitenoise static) → gunicorn.
    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 65s;        # > gunicorn --timeout 60
        proxy_buffering on;            # slow clients no longer hold a gunicorn worker
    }
}
