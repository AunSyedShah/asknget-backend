# Installed as /etc/nginx/sites-available/asknget (the catch-all: the server's IP, a name we do not know, or a domain before it has a
# certificate). What it does on port 80 is decided by /etc/nginx/snippets/asknget-http80.conf, which setup.sh writes: it either serves the
# site or redirects to the HTTPS domain.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/asknget-http80.conf;
}
