[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Syed Aun Muhammad", email = "aunsyedsyed@gmail.com" }
]
requires-python = ">=3.13.0"
dependencies = [
    "cryptography>=50.0.1",
    "dj-database-url>=3.1.2",
    "django-ninja>=1.7.0",
    "gunicorn>=26.2.0",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.5",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
    "whitenoise>=6.12.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
